name: Build

# The trunk signal. Until this file existed, pushing to `dev` started nothing at all:
# `PR Check` only runs for pull requests targeting `master`, and `Release` only for pushes to
# `master` or a `v*` tag. So the branch everybody actually works on was the one branch no
# workflow ever built -- and a status badge pointed at it would have said "no status" forever.
#
# Deliberately NOT triggered by pull_request: `PR Check` already builds five platforms and
# runs the suite for a PR to master, and duplicating that here would double the minutes.
# It builds the three shipped targets and checks the release archive's licences, i.e. the
# things a push to trunk should not break.
on:
  push:
    branches:
      - dev
      - master

jobs:
  linux:
    name: Build (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-build
          repository-cache: true

      # TMPDIR twice on purpose: the first makes Bazel put its sandboxes under the runner's
      # scratch space, the second passes it into the actions. A small sandbox TMPDIR on this
      # project produced `Disk quota exceeded` disguised as a compile error.
      - name: Build
        run: |
          bazel build //src/tui:edgeclaw //:edgeclaw \
                --action_env=TMPDIR="$RUNNER_TEMP"
        env:
          TMPDIR: ${{ runner.temp }}

      # The external repositories exist now, so the licence texts can be compared against the
      # sources they came from.
      - name: Verify third-party notices are current
        run: python3 tools/gen_notices.py --check

      # A POSIX-only libc call (strcasecmp and friends) in a file without edc_compat.h links
      # on every Unix and fails ONLY on the MSVC job in this very workflow. Caught here, the
      # author learns before the Windows matrix entry goes red for a reason its log hides
      # ("unresolved external symbol" appears 130 s into a link step).
      - name: Verify no POSIX-only calls lack the compatibility shim
        run: python3 tools/check_portability.py

      # A genrule with no cmd_bat runs through bash on Windows, which a stock machine does not
      # have -- so the build would silently require Git for Windows again. Paired with the lint
      # above: that one guards the C, this one guards the BUILD files.
      - name: Verify every genrule has a Windows form
        run: python3 tools/check_genrule_portability.py

      # The Linux and Android archives have always been built with -static and nothing ever
      # checked what came out -- the Windows job asserts on its import table, the Linux ones
      # asserted nothing. This reads DT_NEEDED and PT_INTERP out of the archive a user
      # downloads and fails if anything is needed at run time.
      #
      # NO --compilation_mode here, deliberately: this job's Build step above runs in the
      # default fastbuild, so asking cquery for the opt artifact returns a path that was
      # never built (`bazel-out/k8-opt/bin/...`) and the step fails with "no release tarball
      # was produced" -- which is exactly how this gate was born broken. The query must match
      # the build. -static comes from the target's LINK_OPTS, not from the compilation mode,
      # so a fastbuild archive is still the right thing to inspect for this regression.
      # The opt archives users actually download are checked by release.yml.
      - name: Verify the shipped binaries need no shared libraries
        run: |
          set -euo pipefail
          archive=$(bazel cquery --output=files //:edgeclaw \
                      --action_env=TMPDIR="$RUNNER_TEMP" | head -1)
          [ -n "$archive" ] && [ -f "$archive" ] || { echo "no release tarball was produced"; exit 1; }
          tools/check_static.sh "$archive"

      # The lexer/parser are generated and the output is committed, so the build no longer
      # needs flex/bison. What that trades away is the guarantee that the committed output
      # matches the grammar: edit edc_parse.y, forget tools/regen_grammar.sh, and the build
      # happily compiles the old parser. This closes that: regenerate, compare, fail on any
      # difference. Same shape as the notices check above.
      #
      # apt rather than trusting the image: the script pins bison 3.8/flex 2.6 and gives a
      # clear message if the runner's version moves.
      - name: Verify the grammar output is current
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq flex bison
          tools/regen_grammar.sh --check

      # A licence being committed says nothing about it being IN the archive -- that is a
      # pkg_tar srcs list, and dropping one is a one-line mistake no unit test would catch.
      - name: Verify the release archive carries its licences
        run: |
          set -euo pipefail
          tarball=$(bazel cquery --output=files //:edgeclaw --action_env=TMPDIR="$RUNNER_TEMP" | head -1)
          [ -n "$tarball" ] && [ -f "$tarball" ] || { echo "no release tarball was produced"; exit 1; }
          entries=$(tar tzf "$tarball")
          for required in 'LICENSE' 'THIRD_PARTY_NOTICES.md' 'licenses/'; do
            echo "$entries" | grep -q "$required" || { echo "$tarball is missing $required"; exit 1; }
          done
          echo "$tarball carries $(echo "$entries" | grep -c 'LICENSE') licence file(s)"
        env:
          TMPDIR: ${{ runner.temp }}

  # Windows used to be built only by Release (on a push to master or a v* tag), with MinGW
  # discovered from the environment. Nothing on the trunk ever compiled this code with the
  # compiler Windows now uses, so a change that only worked under gcc could sit on dev for
  # days and then fail at the one moment a release is being cut. This job is that signal:
  # it builds the Windows artifacts with MSVC on every push to trunk.
  #
  # `shell: bash` because the rest of this file is bash and Git for Windows provides it; the
  # labels and flags below are the same strings release.yml passes, so the two cannot drift.
  windows:
    name: Build (windows/amd64, MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # No disk cache on Windows, deliberately. Bazel's disk cache never evicts, and MSVC's
      # .obj/.pdb files took D:/_bazel-disk to 7.3 GB in a day (zstd barely compresses them).
      # setup-bazel keys that cache on a hash of every BUILD file, so each commit that touches
      # one produces a NEW key and the action's post step tars + zstd-compresses the whole
      # directory to upload it: measured 8.16 GB, 16m24s inside `tar` alone, 17m08s for the
      # step -- against a 3-minute build. An ~8 GB entry also pushes the repository past its
      # 10 GB cache quota next to everything else, so it is evicted right after being written
      # and the next run misses again: the loop never becomes a hit. Keep the 52 MB bazelisk
      # and 80 MB repository caches, which are what actually make `Setup Bazel` fast; drop
      # this one. The build recompiles, but no step takes longer than the job.
      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: false
          repository-cache: true

      # No toolchain stanzas and no compiler installation: MSVC comes from the runner's
      # Visual Studio Build Tools, which Bazel autodetects. That is the whole point of the
      # toolchain change this job protects -- if Bazel stops finding MSVC, the failure
      # appears here rather than in a release.
      - name: Build
        shell: bash
        run: |
          bazel build --compilation_mode=opt --platforms=//:amd64_windows \
                //src/tui:edgeclaw //:edgeclaw \
                --action_env=TMPDIR="$RUNNER_TEMP"

      # A binary that links but cannot start is a failure the build alone cannot see. This is
      # cheap and it exercises the CRT, the generated version header and the platform table.
      # It smoke-tests the SHIPPED binary -- the one the archive carries -- so what is
      # verified here is what a user runs.
      - name: Smoke test the binary
        shell: bash
        run: |
          set -euo pipefail
          exe=$(bazel cquery --output=files //src/tui:edgeclaw \
                  --compilation_mode=opt --platforms=//:amd64_windows \
                  --action_env=TMPDIR="$RUNNER_TEMP" | head -1)
          [ -n "$exe" ] && [ -f "$exe" ] || { echo "::error::no binary was produced"; exit 1; }
          echo "running: $exe"
          "$exe" --version | tee version.txt
          grep -q 'platform windows/amd64' version.txt \
            || { echo "::error::the binary does not report the platform it was built for"; exit 1; }

      # The archive ships edgeclaw.exe and nothing else, so a runtime DLL import means the
      # program aborts on a clean machine instead of running. Same check release.yml applies
      # to the artifact users download; here it runs on what the trunk produced.
      - name: Verify the Windows binary is self-contained
        shell: bash
        run: |
          set -euo pipefail
          exe=$(bazel cquery --output=files //src/tui:edgeclaw \
                  --compilation_mode=opt --platforms=//:amd64_windows \
                  --action_env=TMPDIR="$RUNNER_TEMP" | head -1)
          [ -n "$exe" ] && [ -f "$exe" ] || { echo "::error:://src/tui:edgeclaw produced no binary"; exit 1; }
          python tools/check_windows_imports.py "$exe"

      # A compiler switch is easy to make and hard to notice: if some other Windows
      # cc_toolchain ever becomes selectable again, everything here would silently build with
      # it. Assert the choice instead of assuming it.
      #
      # The unique --define is load-bearing: toolchain resolution only prints when analysis
      # actually runs, so a warm cache would produce an empty log and this grep would pass or
      # fail for the wrong reason. Changing the define forces a fresh analysis.
      - name: Report the toolchain Bazel selected
        shell: bash
        run: |
          set -euo pipefail
          bazel build --nobuild --toolchain_resolution_debug='.*' \
                --define=ci_toolchain_probe=${{ github.run_id }}-${{ github.run_attempt }} \
                --platforms=//:amd64_windows //src/tui:edgeclaw \
                --action_env=TMPDIR="$RUNNER_TEMP" > toolchain.log 2>&1 || true
          grep 'tools/cpp:toolchain_type -> toolchain' toolchain.log | tail -1 || true
          if grep -q 'cc-compiler-x64_windows' toolchain.log; then
            echo "ok: MSVC (local_config_cc) is the selected C++ toolchain"
          else
            echo "::error::the Windows build did not select MSVC -- check that VS Build Tools"
            echo "::error::is present and that no other Windows cc_toolchain is registered"
            tail -30 toolchain.log
            exit 1
          fi
