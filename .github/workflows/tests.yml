name: Tests

# Runs on every push to trunk, which nothing did before: `PR Check` is pull-request only and
# `Release` is master/tag only, so `dev` was never tested by CI. The badge for this workflow
# is therefore the honest "are the tests green" signal for the branch people work on.
#
# Not triggered by pull_request for the same reason as build.yml: `PR Check` already runs the
# suite (plus ten platforms) for a PR to master.
#
# The Windows leg below runs the SAME suite with MSVC. It could not, until the suite was
# portable: it used fork/waitpid, termios, pthread, mkdtemp, symlink, strtok_r and strptime,
# and it prepared scratch trees with POSIX shell commands. Those are either shimmed now
# (//src/common:win_compat), replaced by a helper (tests/test_fs_util.h), or marked
# POSIX_ONLY in tests/BUILD when the SUBJECT of the test does not exist on Windows -- 16
# targets, which the leg reports as skipped. Measured before adding it: 118 pass, 0 fail,
# 16 skipped, on a machine with no C:\tmp (a fresh runner).
on:
  push:
    branches:
      - dev
      - master

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-test
          repository-cache: true

      # `bazel build //tests:all` before `bazel test`, and it is not redundant: the test
      # command skips every target tagged "manual", which then compile nowhere. Two of them
      # sat broken for months that way.
      - name: Build every test target (including manual)
        run: bazel build //tests:all --action_env=TMPDIR="$RUNNER_TEMP"
        env:
          TMPDIR: ${{ runner.temp }}

      - name: Test
        run: bazel test //tests:all --test_output=errors --action_env=TMPDIR="$RUNNER_TEMP"
        env:
          TMPDIR: ${{ runner.temp }}

  # The same suite with MSVC. It exists because the platform that ships a Windows binary was
  # the one platform whose tests ran nowhere: a change that compiled and passed under gcc could
  # break three Windows-only paths (path separators, the CRT's environment, symlink refusal)
  # and nothing on trunk would notice until a release was cut.
  #
  # The build step is separate for the same reason as the Linux leg -- "manual" targets are
  # skipped by `bazel test` and would otherwise never compile -- and POSIX_ONLY targets are
  # reported as skipped rather than failed, so this job is green on its own terms.
  windows:
    name: Test (windows/amd64, MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-test-windows
          repository-cache: true

      # No toolchain stanza: MSVC comes from the runner's Visual Studio Build Tools and Bazel
      # autodetects it. That is what makes this job also a check on the toolchain resolution --
      # if it ever stops finding cl.exe, the failure is here rather than in a release.
      - name: Build every test target (including manual)
        shell: bash
        run: |
          bazel build --keep_going --platforms=//:amd64_windows //tests:all \
                --action_env=TMPDIR="$RUNNER_TEMP"

      # `--test_output=errors` so a failure prints the assertion that broke, not just the
      # target name. The scratch directories come from Bazel's TEST_TMPDIR, never a hardcoded
      # /tmp, which is why this works on a machine with no C:\tmp at all.
      - name: Test
        shell: bash
        run: |
          bazel test --keep_going --platforms=//:amd64_windows --test_output=errors //tests:all \
                --action_env=TMPDIR="$RUNNER_TEMP"

  asan:
    name: AddressSanitizer + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-asan
          repository-cache: true

      - name: Test with sanitizers
        run: bazel test //tests:all --config=asan --test_output=errors --action_env=TMPDIR="$RUNNER_TEMP"
        env:
          TMPDIR: ${{ runner.temp }}

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    # `id-token: write` is what lets the upload below authenticate with Codecov through
    # OIDC instead of a stored token. Without it the action has no credential at all.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-cov
          repository-cache: true

      # The same three device tests are excluded from the coverage number: under
      # instrumentation test_pppos_agent times out (measured 5467s), and the two stress tests
      # are manual. Excluding them changes the denominator by 566 lines, which is why every
      # percentage quoted is measured with them excluded.
      - name: Coverage
        run: |
          set -euo pipefail
          bazel coverage --config=cov --combined_report=lcov --test_output=summary \
                --action_env=TMPDIR="$RUNNER_TEMP" \
                //tests/... \
                -- -//tests:test_pppos_agent -//tests:test_pppos_stress -//tests:test_pppos_agent_stress
        env:
          TMPDIR: ${{ runner.temp }}

      # OIDC, not a stored token: Codecov's GitHub App is installed on the organisation, so
      # the action can exchange the workflow's short-lived OIDC identity for an upload
      # credential. That means no long-lived secret to leak, rotate, or forget to set --
      # and a fork's pull request can upload too, which a repository secret cannot do.
      #
      # `fail_ci_if_error: false` stays: Codecov is a signal, not a gate. A Codecov outage
      # must not turn a green test run red.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          use_oidc: true
          files: bazel-out/_coverage/_coverage_report.dat
          flags: unittests
          fail_ci_if_error: false

      # A summary in the log so the numbers are visible without codecov.
      #
      # The report path is named literally, not discovered with `find bazel-out`: bazel-out is
      # a SYMLINK, and `find` does not follow it, so the discovery yields an empty string and
      # the script dies on a missing filename -- which is exactly what happened on the first
      # run of this workflow.
      # `find -L` stays as a fallback for an output layout that moves.
      #
      # `|| true` on the whole step: this is a log nicety. If the report ever moves again,
      # the job should say so and stay green -- the coverage RUN above is the real signal.
      - name: Coverage summary
        if: always()
        run: |
          report=bazel-out/_coverage/_coverage_report.dat
          [ -f "$report" ] || report=$(find -L bazel-out -name '_coverage_report.dat' | head -1)
          if [ -z "$report" ] || [ ! -f "$report" ]; then
            echo "no combined coverage report found; the run above still succeeded"
            exit 0
          fi
          echo "report: $report"
          python3 -c 'import sys
          lh=lf=bh=bf=fh=ff=0
          for L in open(sys.argv[1], encoding="utf-8", errors="replace"):
              L=L.strip()
              if L.startswith("LH:"): lh+=int(L[3:])
              elif L.startswith("LF:"): lf+=int(L[3:])
              elif L.startswith("FNH:"): fh+=int(L[4:])
              elif L.startswith("FNF:"): ff+=int(L[4:])
              elif L.startswith("BRH:"): bh+=int(L[4:])
              elif L.startswith("BRF:"): bf+=int(L[4:])
          print("lines %d/%d = %.1f%%" % (lh, lf, 100.0*lh/lf))
          print("functions %d/%d = %.1f%%" % (fh, ff, 100.0*fh/ff))
          print("branches %d/%d = %.1f%%" % (bh, bf, 100.0*bh/bf))' "$report"
        env:
          TMPDIR: ${{ runner.temp }}
